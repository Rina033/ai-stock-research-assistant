command:
  - "python"
  - "app.py"

env:
  - name: LAKEBASE_ENDPOINT_NAME
    valueFrom: "postgres"
  - name: LAKEBASE_SECRET_SCOPE
    value: "database"
  - name: LAKEBASE_SECRET_KEY
    value: "lakebase-url"
  - name: MASSIVE_SECRET_SCOPE
    value: "massive"
  - name: MASSIVE_SECRET_KEY
    value: "api-key"
  - name: MASSIVE_API_BASE_URL
    value: "https://api.massive.com"
  - name: LLM_ENDPOINT
    value: "databricks-llama-4-maverick"
  - name: EMBEDDING_ENDPOINT
    value: "databricks-gte-large-en"
