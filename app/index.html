<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Stock Research Assistant</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --bg: #0f1117; --surface: #1a1d27; --surface2: #222634; --border: #2a2e3d;
      --text: #e4e6f0; --text-dim: #8892a6; --accent: #3b82f6; --accent-hover: #2563eb;
      --green: #22c55e; --red: #ef4444;
    }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); height: 100vh; display: flex; }

    /* Sidebar */
    .sidebar { width: 280px; min-width: 280px; background: var(--surface); border-right: 1px solid var(--border); display: flex; flex-direction: column; }
    .sidebar-header { padding: 20px 16px; border-bottom: 1px solid var(--border); }
    .sidebar-header h1 { font-size: 1rem; font-weight: 600; margin-bottom: 4px; }
    .sidebar-header p { font-size: 0.75rem; color: var(--text-dim); }
    .watchlist-section { flex: 1; overflow-y: auto; padding: 12px 8px; }
    .watchlist-section h2 { font-size: 0.75rem; text-transform: uppercase; color: var(--text-dim); margin-bottom: 8px; padding: 0 8px; }
    .watchlist-item { display: flex; justify-content: space-between; align-items: center; padding: 8px 12px; border-radius: 8px; cursor: pointer; margin-bottom: 4px; transition: background 0.15s; }
    .watchlist-item:hover { background: var(--surface2); }
    .watchlist-item .ticker { font-weight: 600; font-size: 0.9rem; }
    .watchlist-item .price { font-size: 0.8rem; color: var(--text-dim); }
    .watchlist-item .remove { opacity: 0; color: var(--text-dim); cursor: pointer; padding: 2px 6px; border-radius: 4px; font-size: 1rem; }
    .watchlist-item:hover .remove { opacity: 1; }
    .watchlist-item .remove:hover { color: var(--red); }
    .pos { color: var(--green); }
    .neg { color: var(--red); }

    .add-ticker { padding: 12px 16px; border-top: 1px solid var(--border); display: flex; gap: 8px; }
    .add-ticker input { flex: 1; background: var(--surface2); border: 1px solid var(--border); border-radius: 8px; padding: 8px 12px; color: var(--text); font-size: 0.85rem; outline: none; }
    .add-ticker input:focus { border-color: var(--accent); }
    .add-ticker button { background: var(--accent); color: white; border: none; border-radius: 8px; padding: 8px 14px; cursor: pointer; font-size: 0.85rem; font-weight: 500; }
    .add-ticker button:hover { background: var(--accent-hover); }

    /* Main chat area */
    .main { flex: 1; display: flex; flex-direction: column; }
    .chat-header { padding: 20px 24px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
    .chat-header h1 { font-size: 1.1rem; font-weight: 600; }
    .chat-header span { color: var(--text-dim); font-size: 0.8rem; margin-left: 8px; }

    #chat { flex: 1; overflow-y: auto; padding: 24px; max-width: 800px; width: 100%; margin: 0 auto; }
    .msg { margin-bottom: 16px; padding: 12px 16px; border-radius: 12px; max-width: 80%; line-height: 1.6; white-space: pre-wrap; font-size: 0.9rem; }
    .user { background: var(--accent); color: white; margin-left: auto; }
    .bot { background: var(--surface); border: 1px solid var(--border); }
    .typing { color: var(--text-dim); font-style: italic; }

    .quick-actions { padding: 8px 24px; display: flex; gap: 8px; flex-wrap: wrap; max-width: 800px; width: 100%; margin: 0 auto; }
    .quick-btn { background: var(--surface2); border: 1px solid var(--border); color: var(--text-dim); padding: 6px 12px; border-radius: 16px; font-size: 0.75rem; cursor: pointer; transition: all 0.15s; }
    .quick-btn:hover { border-color: var(--accent); color: var(--text); }

    .input-bar { display: flex; gap: 8px; padding: 16px 24px; max-width: 800px; width: 100%; margin: 0 auto; }
    #input { flex: 1; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 12px 16px; color: var(--text); font-size: 0.9rem; outline: none; }
    #input:focus { border-color: var(--accent); }
    #send { background: var(--accent); color: white; border: none; border-radius: 12px; padding: 12px 24px; cursor: pointer; font-size: 0.9rem; font-weight: 500; }
    #send:hover { background: var(--accent-hover); }
    #send:disabled { background: var(--surface2); color: var(--text-dim); cursor: not-allowed; }

    .empty-watchlist { text-align: center; color: var(--text-dim); font-size: 0.8rem; padding: 20px; }
  </style>
</head>
<body>
  <div class="sidebar">
    <div class="sidebar-header">
      <h1>Stock Research</h1>
      <p>Track tickers, ask questions, log analysis</p>
    </div>
    <div class="watchlist-section">
      <h2>Watchlist</h2>
      <div id="watchlist-items"><div class="empty-watchlist">Add tickers to start tracking</div></div>
    </div>
    <div class="add-ticker">
      <input id="ticker-input" type="text" placeholder="Add ticker (e.g. AAPL)" maxlength="5" autocomplete="off">
      <button id="add-btn" onclick="addTicker()">Add</button>
    </div>
  </div>

  <div class="main">
    <div class="chat-header">
      <h1>AI Stock Research Assistant <span>Powered by Massive Stocks API</span></h1>
    </div>
    <div id="chat"></div>
    <div class="quick-actions">
      <button class="quick-btn" onclick="quickSend('Show my watchlist')">Show watchlist</button>
      <button class="quick-btn" onclick="quickSend('What changed since my last visit?')">What changed?</button>
      <button class="quick-btn" onclick="quickSend('Compare AAPL and MSFT')">Compare AAPL vs MSFT</button>
      <button class="quick-btn" onclick="quickSend('Help')">Help</button>
    </div>
    <div class="input-bar">
      <input id="input" type="text" placeholder="Ask about stocks, news, fundamentals..." autocomplete="off">
      <button id="send" onclick="send()">Send</button>
    </div>
  </div>

  <script>
    const chat = document.getElementById('chat');
    const input = document.getElementById('input');
    const sendBtn = document.getElementById('send');
    input.addEventListener('keydown', e => { if (e.key === 'Enter') send(); });
    document.getElementById('ticker-input').addEventListener('keydown', e => { if (e.key === 'Enter') addTicker(); });

    function addMsg(text, cls) {
      const d = document.createElement('div');
      d.className = 'msg ' + cls;
      d.textContent = text;
      chat.appendChild(d);
      chat.scrollTop = chat.scrollHeight;
    }

    function quickSend(msg) {
      input.value = msg;
      send();
    }

    async function send() {
      const msg = input.value.trim();
      if (!msg) return;
      addMsg(msg, 'user');
      input.value = '';
      sendBtn.disabled = true;
      const typingEl = document.createElement('div');
      typingEl.className = 'msg bot typing';
      typingEl.textContent = 'Thinking...';
      chat.appendChild(typingEl);
      chat.scrollTop = chat.scrollHeight;
      try {
        const res = await fetch('/chat', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({message: msg})
        });
        const data = await res.json();
        typingEl.remove();
        addMsg(data.response, 'bot');
      } catch (e) {
        typingEl.remove();
        addMsg('Error: ' + e.message, 'bot');
      }
      sendBtn.disabled = false;
      input.focus();
      refreshWatchlist();
    }

    // Watchlist management
    async function refreshWatchlist() {
      try {
        const res = await fetch('/api/watchlist');
        const data = await res.json();
        const container = document.getElementById('watchlist-items');
        if (!data.watchlists || data.watchlists.length === 0) {
          container.innerHTML = '<div class="empty-watchlist">Add tickers to start tracking</div>';
          return;
        }
        const tickers = data.watchlists[0].tickers || [];
        if (tickers.length === 0) {
          container.innerHTML = '<div class="empty-watchlist">Add tickers to start tracking</div>';
          return;
        }
        // Fetch prices
        let prices = {};
        try {
          const qRes = await fetch(`/api/quotes?tickers=${tickers.join(',')}`);
          prices = await qRes.json();
        } catch (e) {}
        const priceMap = {};
        if (Array.isArray(prices)) prices.forEach(p => { if (p.ticker) priceMap[p.ticker] = p; });

        container.innerHTML = tickers.map(t => {
          const p = priceMap[t];
          const priceStr = p && p.price ? '$' + p.price.toFixed(2) : '';
          const changeStr = p && p.change_percent !== undefined ? (p.change_percent >= 0 ? '+' : '') + p.change_percent.toFixed(2) + '%' : '';
          const cls = p && p.change_percent !== undefined ? (p.change_percent >= 0 ? 'pos' : 'neg') : '';
          return `<div class="watchlist-item" onclick="quickSend('Summarize ${t} performance')">
            <div><div class="ticker">${t}</div><div class="price ${cls}">${priceStr} ${changeStr}</div></div>
            <span class="remove" onclick="event.stopPropagation(); removeTicker('${t}')">&times;</span>
          </div>`;
        }).join('');
      } catch (e) {
        console.error('Watchlist error:', e);
      }
    }

    async function addTicker() {
      const inp = document.getElementById('ticker-input');
      const ticker = inp.value.trim().toUpperCase();
      if (!ticker) return;
      inp.value = '';
      try {
        await fetch('/api/watchlist/tickers', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({ticker})
        });
        refreshWatchlist();
      } catch (e) {
        addMsg('Error adding ticker: ' + e.message, 'bot');
      }
    }

    async function removeTicker(ticker) {
      try {
        await fetch(`/api/watchlist/tickers/${ticker}`, {method: 'DELETE'});
        refreshWatchlist();
      } catch (e) {
        console.error('Remove error:', e);
      }
    }

    // Initialize
    refreshWatchlist();
    setInterval(refreshWatchlist, 30000);
  </script>
</body>
</html>
